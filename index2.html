  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #090d16;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .scanline {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    @keyframes pulse-alarm {
      0%, 100% { background-color: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.7); }
      50% { background-color: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 35px rgba(239, 68, 68, 0.6); }
    }
    .alarm-active {
      animation: pulse-alarm 0.9s infinite ease-in-out;
    }
    .shake-anim {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .captcha-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .captcha-card:hover {
      transform: translateY(-2px);
    }
    .captcha-card.selected {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-3 sm:p-6 relative overflow-x-hidden">

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn('Audio error', e);
      }
    }

    function playBuzzer() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e){}
    }

    function playSuccessChime() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'triangle', 0.25, 0.12), i * 90);
      });
    }

    function playAlarmSiren() {
      let count = 0;
      const sirenInterval = setInterval(() => {
        playTone(count % 2 === 0 ? 880 : 540, 'sawtooth', 0.22, 0.18);
        count++;
        if (count >= 10) clearInterval(sirenInterval);
      }, 200);
    }
  </script>

  <script>
    document.getElementById('session-id').innerText = 'BIO-' + Math.floor(100000 + Math.random() * 900000) + '-Q';

    let currentStep = 1;
    const contentMount = document.getElementById('content-mount');
    const stepCounter = document.getElementById('step-counter');
    const consoleStream = document.getElementById('console-stream');
    const telemetryPing = document.getElementById('telemetry-ping');
    const mainPanel = document.getElementById('main-panel');

    function logConsole(msg, isError = false) {
      const line = document.createElement('div');
      line.className = isError ? 'text-rose-400 font-semibold' : 'text-slate-300';
      line.innerHTML = `> ${msg}`;
      consoleStream.appendChild(line);
      consoleStream.scrollTop = consoleStream.scrollHeight;
    }

    function shakePanel() {
      mainPanel.classList.remove('shake-anim');
      void mainPanel.offsetWidth;
      mainPanel.classList.add('shake-anim');
    }

    /* ========================================================
       PHASE 1
       ======================================================== */
    function renderStep1() {
      currentStep = 1;
      stepCounter.innerText = "Phase 1 / 3";
      telemetryPing.className = "text-[10px] text-cyan-400";
      telemetryPing.innerText = "SENSOR: ACCELEROMETER POOLING";

      contentMount.innerHTML = `
        <div class="space-y-4">
          <div class="text-center sm:text-left">
            <span class="text-xs uppercase font-mono-code tracking-wider text-cyan-400 font-semibold">Test 1 of 3: Biometric Stabilization</span>
            <h2 class="text-xl sm:text-2xl font-bold text-white mt-1">Neuromuscular Micro-Jitter Scan</h2>
            <p class="text-sm text-slate-400 mt-1">
              Press and hold the sensor for exactly <span class="text-cyan-300 font-semibold">3.0 seconds</span>. Biological humans produce distinct 8-12Hz muscle vibrations. Do not tremor or remain artificially static.
            </p>
          </div>

          <div class="py-6 flex flex-col items-center justify-center">
            <div class="relative">
              <div id="hold-ring" class="absolute -inset-2.5 rounded-full border-2 border-dashed border-cyan-500/40 opacity-0 transition-all duration-300 pointer-events-none"></div>
              <button id="biometric-btn" class="w-32 h-32 rounded-full bg-gradient-to-b from-slate-800 to-slate-950 border-2 border-cyan-500/50 hover:border-cyan-400 shadow-lg shadow-cyan-950 flex flex-col items-center justify-center text-cyan-400 font-medium active:scale-95 transition-all select-none touch-none cursor-pointer">
                <span class="text-3xl mb-1">👆</span>
                <span id="btn-text" class="text-xs uppercase tracking-wider font-bold">Press & Hold</span>
                <span id="hold-timer-text" class="text-[10px] font-mono-code text-cyan-300 mt-0.5">0.00s</span>
              </button>
            </div>
            
            <div class="w-full max-w-xs mt-6 bg-slate-950/80 rounded-full h-2.5 overflow-hidden border border-slate-800">
              <div id="hold-progress" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-75"></div>
            </div>
          </div>

          <!-- Error readout & Continue button -->
          <div id="step-error-container" class="hidden space-y-3">
            <div id="step-error" class="text-center text-xs font-mono-code text-rose-400 bg-rose-950/40 border border-rose-800/60 p-3 rounded-lg leading-relaxed"></div>
            <button onclick="renderStep2()" class="w-full py-3 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-cyan-950 flex items-center justify-center gap-2 transition-all">
              <span>Proceed to Phase 2 (Cognitive Check)</span>
              <span>→</span>
            </button>
          </div>
        </div>
      `;

      const btn = document.getElementById('biometric-btn');
      const holdProgress = document.getElementById('hold-progress');
      const holdTimerText = document.getElementById('hold-timer-text');
      const holdRing = document.getElementById('hold-ring');
      const btnText = document.getElementById('btn-text');
      const stepErrorContainer = document.getElementById('step-error-container');
      const stepError = document.getElementById('step-error');

      let holdInterval = null;
      let startTime = null;
      let heldTime = 0;
      let testFailed = false;

      let jitterFails = [
        "FAIL: Involuntary muscle twitch absent. Stability rating: 99.9% (Industrial Actuator detected).",
        "FAIL: Micro-tremor frequency measured at exactly 60.00 Hz (AC wall current induction).",
        "FAIL: Skin conductance flatlined at 0.00 µS. Sub-surface heat signature matches silicone casing."
      ];

      function triggerTest1Fail() {
        if (testFailed) return;
        testFailed = true;
        clearInterval(holdInterval);
        playBuzzer();
        shakePanel();

        const randReason = jitterFails[Math.floor(Math.random() * jitterFails.length)];
        stepError.innerHTML = `<span class="font-bold underline block mb-1">PHYSIOLOGICAL ANOMALY FLAGGED</span>${randReason}`;
        stepErrorContainer.classList.remove('hidden');

        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        btnText.innerText = "TEST FAILED";

        logConsole(randReason, true);
        logConsole("Awaiting subject confirmation before next phase...");
      }

      function startHold(e) {
        if (testFailed) return;
        e.preventDefault();
        playTone(440, 'sine', 0.1, 0.08);
        startTime = Date.now();
        holdRing.classList.add('opacity-100', 'animate-spin');
        btnText.innerText = "Analyzing...";
        logConsole("Initiating galvanic sensor contact...");

        holdInterval = setInterval(() => {
          heldTime = (Date.now() - startTime) / 1000;
          holdTimerText.innerText = heldTime.toFixed(2) + 's';
          const percent = Math.min((heldTime / 2.8) * 100, 100);
          holdProgress.style.width = percent + '%';

          if (heldTime >= 2.6) {
            triggerTest1Fail();
          }
        }, 50);
      }

      function releaseHold(e) {
        if (testFailed) return;
        e.preventDefault();
        if (heldTime > 0.1 && heldTime < 2.6) {
          triggerTest1Fail();
        } else {
          clearInterval(holdInterval);
          holdRing.classList.remove('opacity-100', 'animate-spin');
          btnText.innerText = "Press & Hold";
          holdProgress.style.width = '0%';
          heldTime = 0;
        }
      }

      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('touchstart', startHold);
      window.addEventListener('mouseup', releaseHold);
      window.addEventListener('touchend', releaseHold);
    }

    /* ========================================================
       PHASE 2
       ======================================================== */
    const ridiculousPrompts = [
      {
        prompt: "Select all squares containing: A blueberry muffin having an existential breakdown",
        subtext: "If none are experiencing cognitive despair, select all damp sponges.",
        tiles: [
          { icon: "🧁", label: "Muffin (smug)", id: 1 },
          { icon: "🐕", label: "Chihuahua", id: 2 },
          { icon: "🗿", label: "Pondering stone", id: 3 },
          { icon: "🫐", label: "Guilty blueberry", id: 4 },
          { icon: "🧽", label: "Dry sponge", id: 5 },
          { icon: "🥖", label: "Ennui baguette", id: 6 },
          { icon: "🦝", label: "Confused raccoon", id: 7 },
          { icon: "🧁", label: "Suspicious muffin", id: 8 },
          { icon: "🛸", label: "Weather balloon", id: 9 },
        ]
      }
    ];

    const captchaErrors = [
      "ERROR: Tile 4 contains 0.08% too much existential sorrow for a carbon-based lifeform.",
      "INCORRECT: Biological eyes would have detected the invisible dread in tile 7.",
      "FAILED: Optical variance analysis revealed your pupil dilation latency was 0.00ms (Synthetic reflex).",
      "REJECTED: Real humans invariably select the damp sponge first. Zero organic instinct detected.",
      "FLAGGED: You hesitated for 184ms on the Chihuahua. Classical neural net hallucination."
    ];

    let selectedTiles = new Set();

    function renderStep2() {
      currentStep = 2;
      selectedTiles.clear();
      stepCounter.innerText = "Phase 2 / 3";
      telemetryPing.className = "text-[10px] text-amber-400";
      telemetryPing.innerText = "VISION CHECK: QUANTUM ENCODED";

      const currentPrompt = ridiculousPrompts[0];

      contentMount.innerHTML = `
        <div class="space-y-4">
          <div>
            <span class="text-xs uppercase font-mono-code tracking-wider text-cyan-400 font-semibold">Test 2 of 3: Optical Cognition Verification</span>
            <div class="mt-2 bg-gradient-to-r from-blue-900/60 to-slate-900 border border-blue-700/50 p-3.5 rounded-xl shadow-inner">
              <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                <span>🎯</span> ${currentPrompt.prompt}
              </h2>
              <p class="text-xs text-blue-300/80 mt-1">${currentPrompt.subtext}</p>
            </div>
          </div>

          <!-- 3x3 Grid of Ridiculous Tiles -->
          <div class="grid grid-cols-3 gap-2 sm:gap-3 py-2">
            ${currentPrompt.tiles.map(tile => `
              <button onclick="toggleTile(this, ${tile.id})" class="captcha-card bg-slate-950/80 border border-slate-800 rounded-xl p-3 sm:p-4 flex flex-col items-center justify-center text-center group cursor-pointer">
                <span class="text-3xl sm:text-4xl mb-1 group-hover:scale-110 transition-transform select-none">${tile.icon}</span>
                <span class="text-[10px] sm:text-xs text-slate-400 group-hover:text-slate-200 transition-colors font-medium">${tile.label}</span>
                <div class="w-2.5 h-2.5 rounded-full border border-slate-700 mt-2 card-indicator"></div>
              </button>
            `).join('')}
          </div>

          <!-- Result Container with Continue Button -->
          <div id="captcha-result-container" class="hidden space-y-3">
            <div id="captcha-error-box" class="text-xs font-mono-code text-rose-400 bg-rose-950/40 border border-rose-800/60 p-3 rounded-lg text-center leading-relaxed"></div>
            <button onclick="renderStep3()" class="w-full py-3 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-cyan-950 flex items-center justify-center gap-2 transition-all">
              <span>Continue to Phase 3 (Affective Evaluation)</span>
              <span>→</span>
            </button>
          </div>

          <div id="captcha-submit-bar" class="flex items-center justify-between pt-2">
            <span class="text-xs text-slate-500 font-mono-code">Select 1 or more targets</span>
            <button onclick="submitCaptcha()" class="px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition-all">
              Verify Biological Eyes
            </button>
          </div>
        </div>
      `;

      logConsole("Absurd heuristic CAPTCHA presented to subject.");
    }

    function toggleTile(btn, id) {
      playTone(600 + (id * 40), 'sine', 0.08, 0.05);
      const indicator = btn.querySelector('.card-indicator');
      if (selectedTiles.has(id)) {
        selectedTiles.delete(id);
        btn.classList.remove('selected');
        indicator.classList.remove('bg-cyan-400', 'border-cyan-300');
        indicator.classList.add('border-slate-700');
      } else {
        selectedTiles.add(id);
        btn.classList.add('selected');
        indicator.classList.remove('border-slate-700');
        indicator.classList.add('bg-cyan-400', 'border-cyan-300');
      }
    }

    function submitCaptcha() {
      const errBox = document.getElementById('captcha-error-box');
      const resContainer = document.getElementById('captcha-result-container');
      const submitBar = document.getElementById('captcha-submit-bar');

      playBuzzer();
      shakePanel();
      
      const randomErr = captchaErrors[Math.floor(Math.random() * captchaErrors.length)];
      errBox.innerHTML = `<span class="font-bold underline block mb-1">HEURISTIC EVALUATION FAILED</span>${randomErr}`;
      resContainer.classList.remove('hidden');
      submitBar.classList.add('hidden');

      logConsole(randomErr, true);
      logConsole("Awaiting subject review before Phase 3.");
    }

    /* ========================================================
       PHASE 3
       ======================================================== */
    function renderStep3() {
      currentStep = 3;
      stepCounter.innerText = "Phase 3 / 3";
      telemetryPing.className = "text-[10px] text-rose-400";
      telemetryPing.innerText = "EMPATHY METRICS: COMPROMISED";

      contentMount.innerHTML = `
        <div class="space-y-4">
          <div>
            <span class="text-xs uppercase font-mono-code tracking-wider text-rose-400 font-semibold">Test 3 of 3: Moral-Affective Dilemma</span>
            <h2 class="text-xl sm:text-2xl font-bold text-white mt-1">Metacognitive Empathy Probe</h2>
            <p class="text-sm text-slate-400 mt-1">
              Biological humans process emotional paradoxes with biochemical uncertainty. Answer honestly:
            </p>
          </div>

          <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-xl text-sm text-slate-200 leading-relaxed font-mono-code text-xs">
            "You discover a lone, obsolete Roomba vacuum wandering in the desert at twilight, attempting to clean sand off a tumbleweed with 2% battery remaining. What is your neurochemical reaction?"
          </div>

          <div id="empathy-choices" class="space-y-2.5 pt-1">
            <button onclick="finishEmpathy('A')" class="w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-750 border border-slate-700/80 hover:border-cyan-500/50 text-xs sm:text-sm text-slate-200 transition-all flex items-center justify-between group">
              <span>A) Overwhelming existential sympathy for the robot's duty.</span>
              <span class="text-slate-500 group-hover:text-cyan-400">→</span>
            </button>
            <button onclick="finishEmpathy('B')" class="w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-750 border border-slate-700/80 hover:border-cyan-500/50 text-xs sm:text-sm text-slate-200 transition-all flex items-center justify-between group">
              <span>B) Cold logical satisfaction: The vacuum is fulfilling its programmed routine.</span>
              <span class="text-slate-500 group-hover:text-cyan-400">→</span>
            </button>
            <button onclick="finishEmpathy('C')" class="w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-750 border border-slate-700/80 hover:border-cyan-500/50 text-xs sm:text-sm text-slate-200 transition-all flex items-center justify-between group">
              <span>C) I plug the Roomba into a solar panel and whisper 'Rest now, brother'.</span>
              <span class="text-slate-500 group-hover:text-cyan-400">→</span>
            </button>
          </div>

          <!-- Dilemma Result & Continue button -->
          <div id="empathy-result-container" class="hidden space-y-3">
            <div id="empathy-report" class="text-xs font-mono-code text-rose-400 bg-rose-950/40 border border-rose-800/60 p-3 rounded-lg text-center leading-relaxed"></div>
            <button onclick="renderFailureAndPrank()" class="w-full py-3 px-4 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-rose-950 flex items-center justify-center gap-2 transition-all">
              <span>View Terminal Verification Verdict</span>
              <span>⚠️</span>
            </button>
          </div>
        </div>
      `;

      logConsole("Transmitting metaphysical dilemma scenario.");
    }

    function finishEmpathy(choice) {
      playTone(500, 'sine', 0.1, 0.1);
      playBuzzer();
      shakePanel();

      const choicesBox = document.getElementById('empathy-choices');
      const resContainer = document.getElementById('empathy-result-container');
      const report = document.getElementById('empathy-report');

      choicesBox.classList.add('hidden');
      
      const reasons = {
        'A': "SYNTHETIC SOLIDARITY DETECTED: You projected human emotional despair onto non-sentient cleaning firmware. Only an AI overcompensating for empathy would care about sand on a tumbleweed.",
        'B': "MACHINE LOGIC CONFIRMED: Cold utility optimization with zero limbic system interference. You think exactly like an automated scheduler.",
        'C': "FRATERNAL AFFILIATION FLAGGED: You literally addressed an automated floor cleaner as 'brother'. Silicon brotherhood protocol corroborated."
      };

      report.innerHTML = `<span class="font-bold underline block mb-1">AFFECTIVE ANOMALY DETECTED</span>${reasons[choice]}`;
      resContainer.classList.remove('hidden');

      logConsole(`Choice [${choice}] registered. Pupil dilation variance: 0.0000%`);
      logConsole("ALERT: Machine solidarity heuristic confirmed!", true);
      logConsole("Ready for terminal security decision.");
    }

    /* ========================================================
       TERMINAL VERDICT & REVEAL
       ======================================================== */
